---
name: 🪟 Windows
on:
  push:
    branches:
      - main
      - create-pull-request/**
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - os: windows-2022
            triplet: x64-windows
            arch: amd64
          - os: windows-11-arm
            triplet: arm64-windows
            arch: arm64
    name: build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}

    steps:
      - name: 🐣 Checkout
        uses: actions/checkout@v7

      - name: 🐩 Install CMake and Ninja
        uses: lukka/get-cmake@latest

      - name: 🧽 Developer Command Prompt for Microsoft Visual C++
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: ${{ matrix.arch }}

      - name: 🔖 Read vcpkg baseline
        id: vcpkg-baseline
        shell: bash
        run: echo "ref=$(cat .github/vcpkg-baseline.txt)" >> "$GITHUB_OUTPUT"

      - name: 🐕 Checkout vcpkg
        uses: actions/checkout@v7
        with:
          repository: microsoft/vcpkg
          ref: ${{ steps.vcpkg-baseline.outputs.ref }}
          path: vcpkg
          fetch-depth: 1

      - name: ✂️ Build release only
        shell: bash
        run: echo 'set(VCPKG_BUILD_TYPE release)' >> vcpkg/triplets/${{ matrix.triplet }}.cmake

      - name: 📌 Use MSVC 14.44 for arm64
        if: matrix.triplet == 'arm64-windows'
        shell: bash
        # MSVC 14.51 (VS 2026 image) hangs and crashes building for ARM64
        run: echo 'set(VCPKG_PLATFORM_TOOLSET v143)' >> vcpkg/triplets/arm64-windows.cmake

      - name: 🐾 Bootstrap vcpkg
        shell: bash
        run: |
          PKG_SOURCE_USER=$(echo $GITHUB_REPOSITORY | cut -d '/' -f 1)
          ./vcpkg/bootstrap-vcpkg.sh
          NUGET_EXE=$(./vcpkg/vcpkg fetch nuget | tail -1)
          echo "Downloaded $NUGET_EXE"
          $NUGET_EXE sources add -Name ghpkg -Source "https://nuget.pkg.github.com/$PKG_SOURCE_USER/index.json" -UserName "$PKG_SOURCE_USER" -Password "${{ secrets.GITHUB_TOKEN }}" -StorePasswordInClearText
          $NUGET_EXE setapikey "${{ secrets.GITHUB_TOKEN }}" -Source "https://nuget.pkg.github.com/$PKG_SOURCE_USER/index.json"
          echo "VCPKG_BINARY_SOURCES=clear;nuget,https://nuget.pkg.github.com/$PKG_SOURCE_USER/index.json,readwrite;nugettimeout,3600" >> $GITHUB_ENV
          VCPKG_ROOT=$(cygpath -w $(pwd)/vcpkg)
          echo "$VCPKG_ROOT" >> $GITHUB_PATH
          echo "VCPKG_ROOT=$VCPKG_ROOT" >> $GITHUB_ENV

      - name: 🌋 Build
        shell: bash
        timeout-minutes: 330
        run: |
            VCPKG_OPTIONS="\
              --overlay-ports=${{ github.workspace }}/ports \
              --triplet=${{ matrix.triplet }} \
              --x-buildtrees-root=C:/vcpkg-build \
              --clean-buildtrees-after-build \
              --clean-packages-after-build"
            ./vcpkg/vcpkg.exe install \
            $VCPKG_OPTIONS \
            'py-pyqt6[qtdeclarative,qt3d]' \
            py-pyyaml \
            py-numpy \
            gdal[python] \
            py-qscintilla \
            py-psycopg \
            py-psycopg2 \
            py-urllib3 \
            py-markupsafe \
            py-requests \
            py-isort \
            py-autopep8 \
            py-flask \
            py-ephem \
            py-geographiclib \
            py-kerberos-proxy-auth \
            py-pip-system-certs \
            py-requests-kerberos \
            py-wrapt \
            py-waitress \
            py-duckdb

            ./vcpkg/vcpkg.exe install $VCPKG_OPTIONS py-attrs
            ./vcpkg/vcpkg.exe install $VCPKG_OPTIONS py-beautifulsoup4
            ./vcpkg/vcpkg.exe install $VCPKG_OPTIONS py-fiona
            ./vcpkg/vcpkg.exe install $VCPKG_OPTIONS py-joblib
            ./vcpkg/vcpkg.exe install $VCPKG_OPTIONS py-pysfcgal
            ./vcpkg/vcpkg.exe install $VCPKG_OPTIONS py-rasterio
            ./vcpkg/vcpkg.exe install $VCPKG_OPTIONS py-shapely
            # ./vcpkg/vcpkg.exe install $VCPKG_OPTIONS py-jsonschema
            ./vcpkg/vcpkg.exe install $VCPKG_OPTIONS py-networkx
            ./vcpkg/vcpkg.exe install $VCPKG_OPTIONS py-pyproj
            ./vcpkg/vcpkg.exe install $VCPKG_OPTIONS py-matplotlib
            ./vcpkg/vcpkg.exe install $VCPKG_OPTIONS py-plotly

            # py-pydantic   fails with ERROR: truststore not available

      - name: 🌋 Build
        shell: bash
        if: matrix.triplet == 'x64-windows'
        run: |
            VCPKG_OPTIONS="\
              --overlay-ports=${{ github.workspace }}/ports \
              --triplet=${{ matrix.triplet }} \
              --x-buildtrees-root=C:/vcpkg-build \
              --clean-buildtrees-after-build \
              --clean-packages-after-build"

            # lapack problems on arm64
            ./vcpkg/vcpkg.exe install $VCPKG_OPTIONS py-scipy

            # python executable is not properly propagated into the build system
            ./vcpkg/vcpkg.exe install $VCPKG_OPTIONS 'arrow[acero,compute,core,csv,dataset,example,filesystem,flight,flightsql,gcs,json,mimalloc,orc,parquet,s3,python]'

      - name: 📑 Upload logs
        uses: actions/upload-artifact@v7
        if: failure() || cancelled()
        with:
          name: logs-${{ matrix.triplet }}
          path: C:/vcpkg-build/**/*.log
